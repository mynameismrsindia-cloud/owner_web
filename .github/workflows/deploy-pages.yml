name: Deploy Owner Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - uses: actions/configure-pages@v5
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build web release
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || vars.API_BASE_URL || 'https://wholesellerbackend-production.up.railway.app/api/v1' }}
        run: flutter build web --release --base-href /owner_web/ --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
